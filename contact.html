<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Pastel Dream Closet</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      background: #fff5fa;
      color: #444;
    }
    header {
      background: #ffd9e8;
      padding: 1em;
      text-align: center;
    }
    nav a {
      margin: 0 1em;
      text-decoration: none;
      color: #c2185b;
    }
    .contact-section {
      padding: 2em;
      background: #fffafa;
      border-radius: 10px;
      max-width: 1200px;
      margin: auto;
    }
    .contact-section form input, .contact-section form textarea {
      width: 100%;
      padding: 0.7em;
      margin-top: 0.5em;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .contact-section form button {
      background: #c2185b;
      color: white;
      padding: 0.7em;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    footer {
      background: #ffd9e8;
      padding: 1em;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>
  
  <div class="contact-section">
    <h2>We’d love to hear from you!</h2>
    <p>If you have any questions, feel free to contact us through this form.</p>
    <form>
      <input type="text" placeholder="Your Name" required>
      <input type="email" placeholder="Your Email" required>
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send Message</button>
    </form>
  </div>

  <footer>
    <p>&copy; 2025 Pastel Dream Closet</p>
  </footer>
</body>
</html>
